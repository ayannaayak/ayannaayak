<title>Ayan's Canvas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,300..800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a graphite landing page introduces Ayan, whose photo sits in the hero as a workflow node; one button opens a
   full-screen node canvas where visitors wire nodes to a trigger, press Execute, and each node opens a page about Ayan.
   Single dark theme by choice: it is the ground of a workflow editor. Chrome stays monochrome; colour only appears where
   automation happens (node icons, a running wire, a green check). One accent, for Execute and the main button. */
:root{
  --bg:#141517; --bg-2:#18191c; --surface:#1e1f23; --surface-2:#25272b; --surface-3:#2e3035;
  --line:#2a2c31; --line-2:#3a3d43; --line-3:#565a62;
  --text:#eff0f1; --muted:#a6a9af; --faint:#888c93; --ink:#111214;
  --accent:#ff5a1f; --accent-ink:#1d0a02;
  --ok:#3ecf8e; --ok-ink:#03200f;
  --coral:#ff8a5c; --sky:#5ab9fc; --mint:#3ecf8e; --gold:#f2b84b; --rose:#ff7aa8;
  --sticky:#f3d469; --sticky-ink:#2e2507;
  --wire:#474b53; --wire-2:#6a6f78; --grid:#2c2e33; --grid-lit:#80858e;
  --focus:#8fc1ff; --scrim:rgba(8,9,10,.7);
  --f-display:"Mona Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-body:"Mona Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-color:var(--line-3) var(--bg)}
::selection{background:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--text)}
input,textarea{caret-color:var(--accent)}
html.in-app,html.in-app body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:200;background:var(--bg)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
h1,h2{font-stretch:116%;font-weight:620;letter-spacing:-.035em;line-height:1.02}
h3{font-weight:600;letter-spacing:-.012em;line-height:1.25}
p{margin:0}
.dot,.label{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.ok{color:var(--ok)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* the mark: Ayan's initial as a node, with an output handle */
.mark{position:relative;display:inline-grid;place-items:center;width:1em;height:1em;font-size:30px;border-radius:.27em;background:var(--surface-2);border:1px solid var(--line-2);flex:none}
.mark::before{content:"A";font:700 .5em/1 var(--f-display);font-stretch:125%;color:var(--text);letter-spacing:-.02em}
.mark::after{content:"";position:absolute;right:-.13em;top:50%;width:.22em;height:.22em;margin-top:-.11em;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .07em var(--bg)}

/* buttons: one primary (accent), one secondary (outline) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:12px;padding:12px 20px;font-weight:600;font-size:16px;line-height:1.2;border:1px solid var(--line-2);background:var(--surface);color:var(--text);text-decoration:none;white-space:nowrap;transition:transform .15s,border-color .15s,background-color .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--line-3);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.hot{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.hot:hover{background:#ff6c36}
.btn.sm{min-height:40px;padding:9px 14px;font-size:14.5px;border-radius:10px}
.btn svg.i{width:16px;height:16px}

/* photo slots: show the photo when one is set, otherwise a placeholder that invites one */
.ph-slot{position:relative;margin:0;aspect-ratio:var(--ar,4/5);max-width:100%;border-radius:var(--r,var(--r-lg));overflow:hidden;background:var(--surface);border:1px solid var(--line);container-type:inline-size}
.ph-slot>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:scale .4s ease}
.ph-slot:hover>img{scale:1.025}
.ph-empty{position:absolute;inset:0;width:100%;height:100%;padding:8px;border:0;border-radius:inherit;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;color:var(--faint);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.028) 10px 11px),var(--surface);transition:color .15s,background-color .15s}
.ph-empty:hover{color:var(--text)}
.ph-empty svg{width:clamp(16px,22cqi,46px);height:auto;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ph-empty b{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph-empty small{font-size:12px;line-height:1.3;max-width:22ch}
.ph-x{position:absolute;right:8px;top:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--muted);border-radius:8px;padding:4px 8px;font:500 11px var(--f-mono);opacity:0;transition:opacity .15s}
.ph-slot:hover .ph-x,.ph-x:focus-visible{opacity:1}
@container (max-width:150px){.ph-empty small,.ph-empty b{display:none}}
@container (max-width:240px){.ph-empty small{display:none}}

@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
